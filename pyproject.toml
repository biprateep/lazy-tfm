[project]
name = "lazy-tfm"
version = "0.2.0.dev0"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [
    { name = "Biprateep Dey", email = "biprateep@pitt.edu" },
]
description = "Lazy but Accurate z for Yinz: conditional distributions from tabular foundation models"
keywords = ["foundation model", "tabular", "in-context learning", "probabilistic regression", "conditional density estimation", "photometric redshift", "astronomy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "huggingface-hub>=0.24",
    "h5py>=3.10", # reads the HSC selection grid behind `fetch_dc1_biased`
    "tqdm>=4.66", # prediction progress bars; already arrives via huggingface-hub
]

[project.urls]
"Source Code" = "https://github.com/biprateep/lazy-tfm"
"Documentation" = "https://lazy-tfm.readthedocs.io"
"Bug Tracker" = "https://github.com/biprateep/lazy-tfm/issues"
"Changelog" = "https://github.com/biprateep/lazy-tfm/blob/main/CHANGELOG.md"

# Each backend is optional: `pip install lazy-tfm` on its own gives you the
# grid, metrics, plotting and dataset machinery with no deep-learning stack.
[project.optional-dependencies]
# PyPI refuses packages whose metadata holds direct URLs, so the published
# requirement is the release. The release lacks the KV-cache API
# (`TabFM.prefill` / `TabFM.decode`) that `lazy.models._icl_stream` needs, and
# without it TabFMHistogram re-encodes the training context for every chunk of
# query rows -- ~13.7 ms per member-row against ~0.53 ms, about 26x the compute,
# for identical answers. TabFMHistogram raises TabFMPerformanceWarning when it
# falls back, and the README says how to install the repository build. A uv
# checkout gets that build automatically, from [tool.uv.sources] below.
tabfm = [
    "tabfm[pytorch]>=1.0.1",
    # huggingface_hub loads the checkpoint through `_load_as_safetensor`, which
    # touches `safetensors.__version__` but only imports the module when it is
    # installed -- and neither hub nor tabfm declares it. Without this the load
    # dies with `NameError: name 'safetensors' is not defined`.
    "safetensors>=0.4.3",
]
tabicl = [
    "tabicl>=2.2.0", # TabICLv2; its checkpoint is fetched from Hugging Face on first use
]
tabpfn = [
    "tabpfn>=9.0.0", # TabPFN-3; its checkpoint is fetched from Hugging Face on first use
]
limix = [
    # LimiX itself is not on PyPI, and PyPI refuses metadata with direct URLs,
    # so it is installed separately (see lazy.models._limix_source). These are
    # the dependencies of the two subtrees of it the backend loads. triton
    # arrives with Linux torch wheels; LimiX's network imports it.
    "torch>=2.9.1",
    "einops>=0.8",
    "kditransform>=1.0",
    "nvtx>=0.2",
]
qp = [
    "qp-prob>=1.1", # LSST DESC's PDF package: to_qp()/from_qp() and its file formats, for RAIL
]
all = [
    "lazy-tfm[limix,tabfm,tabicl,tabpfn]",
]

# PEP 735 groups: development tooling, never published in the wheel metadata.
# `uv sync` installs the default group; `uv sync --group docs` adds the rest.
[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.16", # keep in step with the ruff-pre-commit rev in .pre-commit-config.yaml
    "pre-commit>=3.7",
    "ipykernel>=6",
    "jupyter>=1",
    "jupytext>=1.16", # Notebooks are authored as py:percent scripts
    "mypy>=2.3",
    "pandas-stubs>=3.0.5.260914",
    "astropy>=6",
]
docs = [
    "sphinx>=8",
    "sphinx-autoapi>=3",
    "sphinx-copybutton>=0.5",
    "sphinx-design>=0.6",
    "myst-nb>=1.1", # MyST Markdown pages and the tutorial notebooks
    "sphinx-rtd-theme>=3",
]

# Development-only source overrides: honoured by `uv sync` in a checkout, never
# written into the published metadata. The repository build also calls itself
# 1.0.1, so only the commit distinguishes it from the release.
[tool.uv.sources]
tabfm = { git = "https://github.com/google-research/tabfm", rev = "fbb665569425fd2f490c6576b3af967876fe11ff" }

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "lazy"

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--doctest-modules"
markers = [
    "gpu: needs a CUDA device and a downloaded foundation-model checkpoint",
]
# Tests that load a multi-gigabyte checkpoint are opt-in:
#   LAZY_RUN_CHECKPOINT_TESTS=1 uv run pytest

# Code style: the Google Python Style Guide, as adopted by the author's
# code-style skill. Every selected rule names the guide section (§) it enforces
# or the pylint check from Google's pylintrc it replaces. The skill's checker
# (check_code_style.py, codes GS001-GS030) covers what ruff cannot express.
[tool.ruff]
required-version = ">=0.16.0"
line-length = 80  # §3.2
indent-width = 4  # §3.4

[tool.ruff.format]
quote-style = "double"  # §3.10
indent-style = "space"  # §3.4
skip-magic-trailing-comma = false  # §3.4.1

[tool.ruff.lint]
select = [
    "F",  # pyflakes
    "E",  # pycodestyle: imports, line length, statements, None/bool, except
    "W",  # trailing whitespace, tabs, invalid escapes
    "PLC",  # PLC0415 imports at top (§3.13), PLC1802 len (§2.14)
    "PLE",  # pylint errors
    "PLW",  # pylint warnings
    "PLR0402",  # §2.2: `import a.b as b` is `from a import b`
    "B006", "B008",  # §2.12: mutable or call-evaluated defaults
    "B012",  # return/break/continue in finally
    "B015", "B018",  # pointless statements
    "B019",  # functools.lru_cache on a method
    "B023",  # §2.16: closure over a loop variable
    "B904",  # raise ... from inside except
    "BLE",  # §2.4: catch-all except Exception
    "TRY002",  # §2.4: raising bare Exception
    "TRY203",  # try/except that only re-raises
    "ARG",  # unused arguments; fix with `del arg  # Unused.`
    "A001", "A002", "A004", "A006",  # shadowed builtins
    "SLF001",  # §3.16.2: another object's _protected member
    "S102", "S307",  # §2.19: exec and eval
    "G",  # §3.10.1: logging takes a pattern and arguments
    "PGH004",  # §2.1: suppress named rules, never a blanket noqa
    "RUF100",  # §2.1: suppressions that no longer suppress anything
    "I",  # §3.13: import grouping and order, settings below
    "TID252",  # §2.2: no relative imports
    "ICN001",  # §2.2: the standard abbreviation (np, pd, plt)
    "SIM118",  # §2.8: `key in adict`, not `adict.keys()`
    "FURB129",  # §2.8: `for line in afile`, not `afile.readlines()`
    "C417",  # §2.10: a generator expression, not map/filter with a lambda
    "ANN0", "ANN2",  # §2.21: every signature is annotated
    "UP",  # §3.19: X | None, list[int], no typing.Text
    "RUF013",  # §3.19.5: no implicit Optional
    "RUF036",  # §3.19.5: None last in a union
    "RUF009",  # §2.12: call-evaluated dataclass defaults
    "EXE",  # §3.7: shebang lines
    "D",  # §3.8: docstrings, Google convention below
    "TD001", "TD003", "TD004", "TD005", "TD006", "TD007",  # §3.12: TODOs
    "N",  # §3.16: naming
    "SIM115",  # §3.11: open() outside a with block
    "NPY",  # NumPy 2 deprecations and the legacy global random state
]
ignore = [
    "D100",  # module docstrings: the checker's GS014
    "D105",  # magic methods need no docstring
    "UP031", "UP032",  # §3.10 allows % and str.format as well as f-strings
    "UP040", "UP046", "UP047",  # §3.19.6, §3.19.10: TypeAlias and TypeVar
    "PLW0603",  # `global`: disabled in Google's pylintrc
    "PLW0120",  # else clause on a loop: disabled in Google's pylintrc
    "PLW1641",  # __eq__ without __hash__: disabled in Google's pylintrc
    "PLW2901",  # redefined loop name: not a check Google loads
    # The one project-wide deviation from the guide: scikit-learn's API names
    # the feature matrix `X` (fit(X, y)), in signatures and in locals such as
    # X_train. Keeping its vocabulary is what lets these estimators drop into
    # scikit-learn unchanged.
    "N803",
    "N806",
]
external = ["GS"]  # the checker's codes, so `# noqa: GS001` is accepted
dummy-variable-rgx = "^(_|unused_.*|dummy_.*)$"

[tool.ruff.lint.per-file-ignores]
# §3.8.2.1: tests need no docstrings on modules, classes or test functions,
# may read protected members, need no annotations, and take pytest fixtures
# that the body never names.
"tests/**" = ["D101", "D102", "D103", "D107", "ANN", "SLF001", "ARG"]
# A notebook cell shows its last expression, so a bare one is the point.
"docs/tutorials/**" = ["B018"]

[tool.ruff.lint.pydocstyle]
convention = "google"  # §3.8: Args:, Returns:, Raises:

[tool.ruff.lint.isort]
# §3.13: one import per line except typing and collections.abc symbols; groups
# future, standard library, third party, this repository; sorted by module path.
force-single-line = true
single-line-exclusions = ["collections.abc", "typing", "typing_extensions"]
force-sort-within-sections = true
order-by-type = false
known-first-party = ["lazy"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"  # §2.2

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true  # §3.19.1: __init__ may omit `-> None`

# §2.21: type checking, in place of the guide's discontinued pytype.
[tool.mypy]
files = ["src"]
disallow_any_generics = true  # §3.19.15: generics carry their parameters
disallow_incomplete_defs = true  # §2.21: annotate a signature fully or not at all
check_untyped_defs = true
no_implicit_optional = true  # §3.19.5
warn_unused_ignores = true  # §2.1
warn_redundant_casts = true
# Several dependencies (h5py, tabfm, tabicl, tabpfn) ship no type information;
# importing them is not an error, but a misspelled module still is.
disable_error_code = ["import-untyped"]

# The optional backends: CI type-checks without the extras installed, so these
# may be absent. Where they are installed, mypy still reads their types.
[[tool.mypy.overrides]]
module = ["qp", "qp.*", "tabfm", "tabfm.*", "tabicl", "tabicl.*", "tabpfn", "tabpfn.*", "torch", "torch.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/lazy"]
