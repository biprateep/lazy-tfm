# Hooks run on every commit (`uv run pre-commit install` once per clone) and in
# CI on every push and pull request (.github/workflows/pre-commit-ci.yml).
# Tests are not a hook: CI runs them, and a commit should stay fast.
repos:
  # `no-commit-to-branch` is deliberately absent: development happens directly
  # on `main` until the first public release, after which it should be restored
  # alongside branch protection.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        name: Check for large files
        description: Prevent the user from committing very large files.
        # uv.lock is a legitimate ~500 kB and grows with the dependency tree.
        # Data belongs in the HF/Zenodo caches (see lazy.datasets), never in git.
        args: ['--maxkb=1024']
  # Verify that pyproject.toml is well formed
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: '0.26'
    hooks:
      - id: validate-pyproject
        name: Validate pyproject.toml
        description: Verify that pyproject.toml adheres to the established schema.
  # Verify that GitHub workflows are well formed
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.2
    hooks:
      - id: check-github-workflows
        args: ["--verbose"]
  # §2.21: ruff and mypy run from the locked environment, so uv.lock is the
  # one pin of each and the hooks see the same dependencies as the code.
  - repo: local
    hooks:
      - id: ruff
        name: Lint code using ruff; sort and organize imports
        entry: uv run --no-sync ruff check --fix --force-exclude
        language: system
        types_or: [ python, pyi ]
      - id: ruff-format
        name: Format code using ruff
        entry: uv run --no-sync ruff format --force-exclude
        language: system
        types_or: [ python, pyi, jupyter ]
      - id: mypy
        name: Type-check with mypy
        entry: uv run --no-sync mypy
        language: system
        types: [python]
        files: ^src/
        pass_filenames: false
      # The Google style rules ruff cannot express. An error fails the hook;
      # a warning does not. It imports a package to tell its submodules from
      # its other members, and notes an import it cannot check.
      - id: code-style
        name: Check the style rules ruff cannot
        entry: uv run --no-sync python .claude/skills/code-style/scripts/check_code_style.py
        language: system
        types: [python]
        exclude: ^\.claude/
