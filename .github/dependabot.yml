# Monthly update PRs, one per ecosystem: the GitHub Actions, and the locked
# Python dependencies (uv.lock), ruff among them, which the pre-commit hooks
# run. The other pre-commit hook revisions are not covered: refresh them with
# `uv run pre-commit autoupdate`. A release is offered only once it is a week
# old, so a broken release is usually yanked first.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
    cooldown:
      default-days: 7
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      python:
        patterns: ["*"]
    cooldown:
      default-days: 7
