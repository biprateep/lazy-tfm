# On request, report what upstream has published since lazy pinned it
# (Actions -> "Upstream check" -> Run workflow): newer revisions of the pinned
# checkpoints, new checkpoint repositories of the same models, and newer
# backend packages. It changes nothing; the report is the job summary.
# Nothing runs on a schedule: checks that do not guard a change run on
# request.

name: Upstream check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
    - name: Install the locked environment
      run: uv sync --locked --no-dev
    - name: Report upstream changes
      run: uv run --no-sync python .github/scripts/check-upstream.py >> "$GITHUB_STEP_SUMMARY"
