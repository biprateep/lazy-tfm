# Build, check and publish the package. See CONTRIBUTING.md, "Making a release".
#
#   * A published GitHub release uploads to PyPI, once the test suite passes
#     on the tagged commit.
#   * Running this workflow by hand (Actions -> Publish -> Run workflow) uploads
#     to TestPyPI instead: a dry run of the whole path, safe to repeat.
#
# Uploads use trusted publishing, so no API token is stored in the repository,
# and the publish action attaches PEP 740 attestations to each file. Both
# indexes must list this workflow as a trusted publisher, each for its own
# GitHub environment (`pypi`, `testpypi`):
#   https://docs.pypi.org/trusted-publishers/adding-a-publisher/

name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
    - name: Check the version matches the release tag
      if: github.event_name == 'release'
      run: |
        version=$(uv version --short)
        tag="${GITHUB_REF_NAME#v}"
        if [ "$version" != "$tag" ]; then
          echo "pyproject version $version does not match release tag $tag" >&2
          exit 1
        fi
    - name: Build the sdist and wheel
      run: uv build
    - name: Check the metadata renders on PyPI
      run: uvx twine check --strict dist/*
    - name: Check what the archives hold
      run: .github/scripts/check-dist.sh
    - name: Install the wheel into a clean environment and import it
      run: |
        uv venv --python 3.12 /tmp/smoke
        VIRTUAL_ENV=/tmp/smoke uv pip install dist/*.whl
        /tmp/smoke/bin/python -c "import lazy; print('lazy', lazy.__version__)"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: dist
        path: dist/

  # The suite on the commit being released, so that a release cannot go out
  # before CI has passed on it.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
    - name: Install the locked environment
      run: uv sync --locked --python 3.12
    - name: Run unit tests with pytest
      run: uv run --no-sync pytest

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: [build, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/p/lazy-tfm
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
      with:
        name: dist
        path: dist/
    - name: Publish to TestPyPI
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
      with:
        repository-url: https://test.pypi.org/legacy/
        # A version can be uploaded once; re-running a dry run should not fail.
        skip-existing: true

  pypi:
    if: github.event_name == 'release'
    needs: [build, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/lazy-tfm
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
      with:
        name: dist
        path: dist/
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
