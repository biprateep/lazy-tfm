# On request, run against the *latest* resolvable dependencies rather than
# uv.lock (Actions -> "Unit test smoke test" -> Run workflow).
#
# The locked jobs in testing-and-coverage.yml cannot see a new upstream release
# that breaks us. This one can: it is the early warning that an upstream change
# needs a lockfile bump. A failure here is not a failure of the merged code.
# The backends job matters most, since the backends reach into upstream
# internals. Nothing runs on a schedule: checks that do not guard a change run
# on request.
# See https://lincc-ppt.readthedocs.io/en/latest/practices/ci_testing.html#version-culprit

name: Unit test smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
    - name: Install the newest resolvable environment
      run: uv sync --upgrade --python ${{ matrix.python-version }}
    - name: List dependencies
      run: uv pip list
    - name: Run unit tests with pytest
      run: uv run --no-sync pytest

  # The newest release of every backend package, installed as the locked
  # backends job in testing-and-coverage.yml installs them.
  backends:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
    - name: Install the newest backend packages with CPU-only PyTorch
      run: .github/scripts/install-backends-cpu.sh --upgrade
    - name: List dependencies
      run: uv pip list
    - name: Run unit tests with pytest
      run: .venv/bin/python -m pytest
