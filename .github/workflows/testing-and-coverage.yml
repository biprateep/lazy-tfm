# Unit tests and coverage against the locked dependency set.
#
# `uv sync --locked` fails if uv.lock is out of date with pyproject.toml, so a
# dependency change that was not locked cannot merge. The `build` jobs install
# no backend package, so the tests whose fakes need one skip there; the
# `backends` job installs every backend's locked package with CPU-only PyTorch
# and runs them. No job needs a GPU or downloads a checkpoint.

name: Unit test and code coverage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded pull-request runs are cancelled; every run on main finishes.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
      with:
        enable-cache: true
    - name: Install the locked environment
      run: uv sync --locked --python ${{ matrix.python-version }}
    - name: Run unit tests with pytest
      run: uv run --no-sync pytest --cov --cov-report=xml
    # The legs measure the same code, so one report is enough.
    - name: Upload coverage report to codecov
      if: matrix.python-version == '3.12'
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

  # The oldest versions pyproject.toml allows, so a floor that no longer
  # installs or works is caught here rather than by a user.
  minimum-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
      with:
        enable-cache: true
    - name: Install the lowest allowed versions
      run: |
        uv venv --python 3.12
        uv pip install --resolution lowest-direct --only-binary :all: \
          -e . --group dev
    - name: Run unit tests with pytest
      run: .venv/bin/python -m pytest

  # Every backend's locked upstream package, on a CPU and without checkpoints,
  # so the fakes run against the real upstream code. The export drops the CUDA
  # wheels that the lockfile pins for Linux, and the install takes PyTorch from
  # its CPU index.
  backends:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
      with:
        enable-cache: true
    - name: Install the locked backend packages with CPU-only PyTorch
      run: |
        uv export --locked --all-extras --group backends --group dev \
          --no-hashes --no-emit-project \
          | grep -vE '^(nvidia-|triton)' > requirements-cpu.txt
        uv venv --python 3.12
        uv pip install --torch-backend cpu -r requirements-cpu.txt -e .
    - name: Run unit tests with pytest
      # This job also runs the tests that need a backend package, so it
      # holds coverage to a higher floor than pyproject.toml's.
      run: .venv/bin/python -m pytest --cov --cov-report=xml --cov-fail-under=89
    - name: Upload coverage report to codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        flags: backends

  # The same build and checks the release runs, on every push and pull request,
  # so a packaging mistake surfaces here rather than on release day.
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
    - name: Build the sdist and wheel
      run: uv build
    - name: Check the metadata renders on PyPI
      run: uvx twine check --strict dist/*
    - name: Check what the archives hold
      run: .github/scripts/check-dist.sh
    - name: Install the wheel into a clean environment and import it
      run: |
        uv venv --python 3.12 /tmp/smoke
        VIRTUAL_ENV=/tmp/smoke uv pip install dist/*.whl
        /tmp/smoke/bin/python -c "import lazy; print('lazy', lazy.__version__)"
