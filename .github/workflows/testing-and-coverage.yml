# Unit tests and coverage against the locked dependency set.
#
# `uv sync --locked` fails if uv.lock is out of date with pyproject.toml, so a
# dependency change that was not locked cannot merge. The backend extras
# (tabfm, tabicl, tabpfn) are deliberately not installed: every test runs without a GPU
# or a multi-gigabyte checkpoint, and the backends are imported lazily.

name: Unit test and code coverage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
    - name: Install the locked environment
      run: uv sync --locked --python ${{ matrix.python-version }}
    - name: Run unit tests with pytest
      run: uv run --no-sync pytest --cov=lazy --cov-report=xml
    - name: Upload coverage report to codecov
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
