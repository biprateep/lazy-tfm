# Build the Sphinx documentation, so a broken docstring or notebook fails the PR
# rather than the Read the Docs build after merge.

name: Build documentation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded pull-request runs are cancelled; every run on main finishes.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
      with:
        enable-cache: true
    - name: Install the locked environment with docs dependencies
      run: uv sync --locked --group docs
    - name: Build docs
      run: uv run --no-sync sphinx-build -T -E -W --keep-going -b html -d docs/build/doctrees ./docs docs/build/html
