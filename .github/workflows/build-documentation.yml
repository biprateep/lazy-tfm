# Build the Sphinx documentation, so a broken docstring or notebook fails the PR
# rather than the Read the Docs build after merge.

name: Build documentation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
    - name: Install the locked environment with docs dependencies
      run: uv sync --locked --group docs
    - name: Install pandoc for notebook rendering
      run: sudo apt-get update && sudo apt-get install -y pandoc
    - name: Build docs
      run: uv run --no-sync sphinx-build -T -E -W --keep-going -b html -d docs/build/doctrees ./docs docs/build/html
