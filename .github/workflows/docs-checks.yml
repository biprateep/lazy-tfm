# On request, check what the docs build does not: that the external links
# resolve, and that the code in the docs runs. From the Actions tab ("Docs
# checks" -> Run workflow), or by adding the label "docs-checks" to a pull
# request; to run it again on a pull request, remove the label and add it
# back. Nothing runs on a schedule. The code check runs docs/snippets/*.py on
# a CPU, and downloads the TabPFN v3.5-fast weights from Hugging Face.

name: Docs checks

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  links:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'docs-checks'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # On the job, so that a run another label starts, which skips the job,
    # cancels nothing: a new request replaces the one still running.
    concurrency:
      group: ${{ github.workflow }}-links-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
      with:
        enable-cache: true
    - name: Install the locked environment with docs dependencies
      run: uv sync --locked --group docs
    - name: Check the external links
      run: uv run --no-sync sphinx-build -b linkcheck -q docs docs/build/linkcheck

  snippets:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'docs-checks'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: ${{ github.workflow }}-snippets-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
      with:
        enable-cache: true
    - name: Install the locked backend packages with CPU-only PyTorch
      run: .github/scripts/install-backends-cpu.sh
    - name: Run the code in the docs
      run: |
        for snippet in docs/snippets/*.py; do
          echo "::group::$snippet"
          .venv/bin/python "$snippet"
          echo "::endgroup::"
        done
