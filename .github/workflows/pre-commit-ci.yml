# Run the pre-commit hooks on every push and pull request, so style is enforced
# even when a contributor has not installed them locally.
#  https://lincc-ppt.readthedocs.io/en/latest/practices/ci_precommit.html

name: Run pre-commit hooks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  pre-commit-ci:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
    - name: Install the locked environment
      run: uv sync --locked
    - name: Run pre-commit
      run: uv run --no-sync pre-commit run --all-files --verbose --show-diff-on-failure
